name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Check packaged frontend
        run: git diff --exit-code -- src/echoscript/web_assets
        working-directory: .

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install test dependencies
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from importlib.metadata import requires
          from pathlib import Path

          metadata = tomllib.loads(Path('pyproject.toml').read_text())
          runtime = metadata['project']['dependencies']
          model_dependencies = [item for item in runtime if item.startswith('qwen-asr')]
          cpu_dependencies = [item for item in runtime if item not in model_dependencies]
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *cpu_dependencies, *metadata['dependency-groups']['dev']])
          # Backend discovery needs the package, while model inference remains opt-in.
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', '-e', '.', *model_dependencies])
          # The legacy CLI reads Whisper's language table without loading a model.
          language_dependencies = [item for item in requires('qwen-asr') if item.startswith('transformers')]
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *language_dependencies])
          PY
      - name: Run tests
        run: python -m pytest -m "not integration"
