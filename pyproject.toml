[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echoscript"
version = "0.2.0"
description = "Local audio/video transcription with a FastAPI web workspace and isolated GPU workers"
authors = [{ name = "susuky" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "opencc-python-reimplemented>=0.1.7",
    "qwen-asr>=0.0.6",
    "yt-dlp[default,deno]==2026.8.19",
    "secretstorage>=3.3; sys_platform == 'linux'",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
faster-whisper = ["faster-whisper>=1.1.0"]
diarization = ["pyannote-audio>=4.0,<5"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/susuky/echoscript"
Repository = "https://github.com/susuky/echoscript"

[project.scripts]
echoscript = "echoscript.cli:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
echoscript = ["web_assets/*", "web_assets/assets/*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"
markers = [
    "integration: opt-in tests that run ffmpeg and real ASR/diarization models",
]
